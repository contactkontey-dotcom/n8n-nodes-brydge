name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows as well as Linux: releases are cut from a range of machines, and
    # on Windows npm, npx and every node_modules/.bin tool are .cmd files and
    # files check out with CRLF line endings.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # isolated-vm (pulled in transitively by the n8n-workflow dev dependency)
      # ships no Node 20 prebuild, so a normal install compiles it from source
      # and fails on the CI runners. This adapter never loads it — it is n8n's
      # expression sandbox — so skip dependency install scripts; nothing we
      # build, type-check or test needs the native module.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The package the scan reads is the one `npm publish` would build and
      # pack — dist only, no runtime dependencies. Dry-run it so a change that
      # would ship the wrong files, or pull in a dependency, fails here.
      - run: npm pack --dry-run
